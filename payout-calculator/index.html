</head>

    <nav id="nav">
        <h3>Payout Calculator - Adam A.</h3>
        <form id="apiKeyModal" class="flex-row field" style="display:none;">
            <input type="text" class="input" id="apiKeyInput" placeholder="Enter API Key">
            <button class="primary" type="submit">Submit</button>
        </form>
    </nav>

    <div id="alert"></div>

    <div id="root">

        <div class="card center-text">
            <h4>Calculate Payouts</h4>
            <div class="field success">
                <label for="faction-cut">Faction Cut</label>
                <input type="number" value="20" id="faction-cut" class="input" placeholder="Enter Faction Cut">
                <div class="hint">How much does the faction take?</div>
            </div>
            <div class="field error">
                <label for="war">War</label>
                <select id="war" class="select error">
                    <option value="">Select…</option>

                </select>
                <div class="hint">Please choose a war</div>
            </div>
            <button class="primary" id="calculateBtn">Calculate Payouts</button>
        </div>

        <hr>


        <div class="card center-text">
            <div class="table-container">
                <table id="displayTable">
                    <thead>
                        <th data-title="Username">Name</th>
                        <th data-title="Respect Gained">Resp</th>
                        <th data-title="Outside Hits">OH</th>
                        <th data-title="Inside Hits">IH</th>
                        <th data-title="Fees (Bounties ect.)">Fees</th>
                        <th data-title="Total Payout">Payout</th>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="6" class="center-text">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <hr>

        <div class="card center-text">
            <h4>Settings</h4>
            <div class="flex-align">
                <button class="secondary">Git</button>
                <button onclick="document.body.classList.toggle('neon-mode')">🎛 Toggle Neon Mode</button>
                <button class="primary" onclick="localStorage.removeItem('apiKey'); location.reload();">Reset
                    Key</button>
            </div>
        </div>

    </div>
    <script src="main.js" type="module"></script>
</body>

</html>
